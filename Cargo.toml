[package]
name = "listen"
version = "0.1.0"
edition = "2024"

[features]
default = ["linux"]
linux = []
macos = []
freebsd = []
openbsd = []
windows = []

[dependencies]
aead = { version = "0.5", default-features = false }
# aes-gcm = { version = "0.10", default-features = false }
aes-gcm-siv = { version = "0.11", default-features = false, features = ["aes"] }
anyhow = { version = "1.0.102", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
chacha20 = { version = "0.10", default-features = false, features = ["cipher"] }
chacha20poly1305 = { version = "0.10", default-features = false }
cipher = { version = "0.5", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false, features = ["rand_core"] }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
libc = { version = "0.2.186", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
rustix = { version = "1.1.4", default-features = false, features = ["net", "std"] }
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"        # LLVM is more aggressive about dropping things at -Oz
strip = true
