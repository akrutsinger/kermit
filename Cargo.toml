[workspace]
members = ["crypto", "listen", "holla", "common"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal
common = { path = "common" }
crypto = { path = "crypto" }

# External
anyhow = { version = "1.0.102", default-features = false }
critical-section = { version = "1.2" }
embassy-executor = { version = "0.9", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
static_cell = { version = "2", default-features = false }
chacha20 = { version = "0.10", default-features = false, features = ["cipher"] }
cipher = { version = "0.5", default-features = false }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
libc = { version = "0.2.186", default-features = false }
getrandom = { version = "0.4", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["net"] }
sha2 = { version = "0.11", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"        # LLVM is more aggressive about dropping things at -Oz
strip = true
