[package]
name = "listen"
version = "0.1.0"
edition.workspace = true

[features]
default = ["linux"]
linux = ["runtime-threads"]
macos = []
freebsd = []
openbsd = []
windows = []

# Concurrency runtime. runtime-threads (thread-per-packet, hosted) is the only runtime today;
# the embedded async runtime was removed until a target is chosen (ADR-0007).
runtime-threads = []

[dependencies]
# Internal
common.workspace = true
crypto.workspace = true

# External
chacha20.workspace = true
libc.workspace = true
getrandom.workspace = true
rustix.workspace = true
