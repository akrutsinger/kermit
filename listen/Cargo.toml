[package]
name = "listen"
version = "0.1.0"
edition.workspace = true

# The OS backend is chosen by the compile target (`--target`), not by a feature (ADR-0008).
[features]
default = ["runtime-threads"]

# Concurrency runtime. runtime-threads (thread-per-packet, hosted) is the only runtime today;
# the embedded async runtime was removed until a target is chosen (ADR-0007).
runtime-threads = []

[dependencies]
# Internal
common.workspace = true
crypto.workspace = true

# External
chacha20.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true
