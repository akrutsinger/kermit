[package]
name = "listen"
version = "0.1.0"
edition.workspace = true

[features]
default = ["linux"]
linux = ["runtime-threads"]
macos = []
freebsd = []
openbsd = []
windows = []

# Concurrency runtime (mutually exclusive; enforced in src/runtime.rs).
# runtime-threads: OS thread pool (pthreads) for hosted builds.
# runtime-embassy: embassy async executor for embedded (future; seam only).
runtime-threads = []
runtime-embassy = [
    "dep:embassy-executor",
    "dep:embassy-sync",
    "dep:critical-section",
    "dep:static_cell",
]

[dependencies]
# Internal
common.workspace = true
crypto.workspace = true

# External
chacha20.workspace = true
libc.workspace = true
getrandom.workspace = true
rustix.workspace = true

# runtime-embassy only
critical-section = { workspace = true, optional = true }
embassy-executor = { workspace = true, features = ["executor-thread"], optional = true }
embassy-sync = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
